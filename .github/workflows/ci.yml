name: Bravos CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bravos-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  COREPACK_ENABLE_AUTO_PIN: "0"
  NEXT_TELEMETRY_DISABLED: "1"

defaults:
  run:
    shell: bash

jobs:
  static-and-build:
    name: Types, architecture, scripts and builds
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22.23.3"
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: "10.34.5"
          run_install: false
          cache: false
      - name: Verify runtime pins
        run: |
          test "$(node --version)" = "v22.23.3"
          test "$(pnpm --version)" = "10.34.5"
          node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync("package.json", "utf8")); if (p.packageManager !== "pnpm@10.34.5" || p.engines.node !== ">=22.23.3 <23") throw new Error("Update CI pins alongside packageManager and engines.node");'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies for moderate or higher advisories
        run: pnpm audit --prod --audit-level=moderate
      - name: Verify ZIP and streaming Excel dependency compatibility
        run: node --test tests/scripts/archive-dependency-compatibility.test.mjs
      - name: Verify receipt validation and native Windows rendering without printing
        run: node --import tsx --test tests/scripts/print-connector-jobs.test.mjs tests/scripts/print-native-renderer.test.mjs
      - name: Typecheck every workspace
        run: pnpm typecheck
      - name: Enforce imports and dependency boundaries
        run: pnpm check:architecture
      - name: Check performance script syntax
        run: node --check scripts/measure-storefront-performance.mjs
      - name: Run pure performance and bundle guard script tests
        run: node --test tests/scripts/storefront-performance.test.mjs tests/scripts/check-bundles.test.mjs tests/scripts/embedded-postgres-stage-error.test.mjs tests/scripts/windows-postgres-start.test.mjs
      - name: Check the Windows restricted runner contract
        run: node --test tests/scripts/windows-restricted-runner.test.mjs
      - name: Check sample catalog intake guards without accessing business data
        run: node --import tsx --test tests/scripts/sample-catalog.test.mjs
      - name: Build API, internal app and storefront; check bundle separation
        run: pnpm build

  http:
    name: PostgreSQL and HTTP integration
    needs: static-and-build
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22.23.3"
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: "10.34.5"
          run_install: false
          cache: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run all PostgreSQL and HTTP tests, including migrations
        shell: pwsh
        run: |
          & ./scripts/run-windows-restricted.ps1 -FilePath (Get-Command node).Source -ArgumentList @('--import','tsx','scripts/windows-postgres-smoke.ts')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/run-windows-restricted.ps1 -FilePath (Get-Command node).Source -ArgumentList @('--run','test:http')
          exit $LASTEXITCODE

  browser:
    name: Chromium browser acceptance
    needs: static-and-build
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22.23.3"
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: "10.34.5"
          run_install: false
          cache: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install the locked Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: Allow Next.js typegen writes on storefront checkout files
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          if ([string]::IsNullOrWhiteSpace($root)) { throw 'GITHUB_WORKSPACE is required' }
          $rootFull = [System.IO.Path]::GetFullPath($root)
          $identity = $null
          try {
            $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent()
            $sid = $identity.User
            $rule = New-Object System.Security.AccessControl.FileSystemAccessRule($sid, [System.Security.AccessControl.FileSystemRights]::Write, [System.Security.AccessControl.AccessControlType]::Allow)
            foreach ($rel in @('apps/storefront/tsconfig.json', 'apps/storefront/next-env.d.ts')) {
              $full = [System.IO.Path]::GetFullPath((Join-Path $rootFull $rel))
              $prefix = if ($rootFull.EndsWith([char]92)) { $rootFull } else { $rootFull + [char]92 }
              if (-not $full.StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase)) { throw "Path escaped workspace: $full" }
              $item = Get-Item -LiteralPath $full -Force
              if ($item.PSIsContainer -or $item.Attributes.HasFlag([System.IO.FileAttributes]::ReparsePoint) -or $item.Attributes.HasFlag([System.IO.FileAttributes]::Directory)) { throw "Not a regular leaf file: $full" }
              $acl = Get-Acl -LiteralPath $full
              Write-Host "file=$full attributes=$($item.Attributes) owner=$($acl.Owner) sddl=$($acl.Sddl)"
              if ($item.Attributes.HasFlag([System.IO.FileAttributes]::ReadOnly) -or $item.Attributes.HasFlag([System.IO.FileAttributes]::Hidden)) { throw "ReadOnly or Hidden is set on $full; refusing to change attributes" }
              $fileInfo = New-Object System.IO.FileInfo($full)
              $writableAcl = [System.IO.FileSystemAclExtensions]::GetAccessControl($fileInfo, [System.Security.AccessControl.AccessControlSections]::Access)
              $writableAcl.AddAccessRule($rule) | Out-Null
              [System.IO.FileSystemAclExtensions]::SetAccessControl($fileInfo, $writableAcl)
            }
          } finally {
            if ($identity) { $identity.Dispose() }
          }
      - name: Run the complete browser suite on its isolated stack
        shell: pwsh
        run: |
          & ./scripts/run-windows-restricted.ps1 -FilePath (Get-Command node).Source -ArgumentList @('--import','tsx','scripts/windows-postgres-smoke.ts')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/run-windows-restricted.ps1 -FilePath (Get-Command node).Source -ArgumentList @('--run','test:browser','--','--reporter=line')
          exit $LASTEXITCODE
